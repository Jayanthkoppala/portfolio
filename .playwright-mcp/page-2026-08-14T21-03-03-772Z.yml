  - paragraph [ref=f6e132]: how it started, in my own words —
  - generic [ref=f6e133]:
    - heading "The story." [level=2] [ref=f6e134]:
      - generic [ref=f6e135]: The
      - generic [ref=f6e136]: story.
    - generic [ref=f6e137]:
      - paragraph [ref=f6e138]: The first thing anyone paid me for was marketing. ₹500, three months, I was 16. I freelanced after that and the money got real — and I noticed I was getting better at earning and not at building. So I stopped.
      - paragraph [ref=f6e139]: At 17 I left home for a college on the other side of the country, in a state where I didn't speak the language. I picked it for that reason. Nothing there was handled for me. I had to talk to strangers to get anything done.
      - paragraph [ref=f6e140]: College happened around the building, not the other way around. Somewhere in there I interned, worked full-time, ran a business of my own, won hackathons, started companies — stacked on top of classes. I've slept through exams I should have taken and events I wanted to attend because I coded till sunrise. I've been broke with a cracked mac screen, still shipping.
      - paragraph [ref=f6e141]:
        - text: When I go quiet, it's not rest. It's
        - generic [ref=f6e142]: cooking season.
      - paragraph [ref=f6e143]: "The pattern, honestly: I put myself somewhere I don't belong and let it change me. Comfort is the thing that's always made me worse. Right now that somewhere is Bengaluru — most nights, still up, building."
